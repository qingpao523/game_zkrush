<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>钟馗之一笔镇妖</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0a0a1a;
  font-family: 'STKaiti', 'KaiTi', 'SimSun', serif;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#gameCanvas {
  display: block;
  width: 100%; height: 100%;
  cursor: crosshair;
}
#ui-overlay {
  position: fixed; top: 0; left: 0; right: 0;
  padding: 10px 14px;
  display: flex; justify-content: space-between; align-items: flex-start;
  pointer-events: none; z-index: 10;
}
.ui-box {
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(255,200,50,0.3);
  border-radius: 8px;
  padding: 5px 12px;
  color: #ffd700;
  font-size: 14px;
  text-shadow: 0 0 6px rgba(255,200,0,0.4);
}
.ui-center { text-align: center; }
#combo-display {
  position: fixed; top: 45%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 44px; color: #ff4444;
  text-shadow: 0 0 20px rgba(255,0,0,0.8), 0 2px 4px rgba(0,0,0,0.9);
  pointer-events: none; z-index: 20;
  opacity: 0; transition: opacity 0.3s, transform 0.3s;
  font-weight: bold;
}
#talisman-display {
  position: fixed; bottom: 60px; left: 50%;
  transform: translateX(-50%);
  font-size: 22px; color: #ffd700;
  text-shadow: 0 0 12px rgba(255,200,0,0.6);
  pointer-events: none; z-index: 20;
  opacity: 0; transition: opacity 0.4s;
}
#wave-announce {
  position: fixed; top: 38%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 34px; color: #ffd700;
  text-shadow: 0 0 20px rgba(255,200,0,0.8);
  pointer-events: none; z-index: 30;
  opacity: 0; transition: opacity 0.5s;
}
#start-screen {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at center, #1a1a3a 0%, #0a0a1a 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 100;
}
#start-screen h1 {
  font-size: 38px; color: #ffd700;
  text-shadow: 0 0 30px rgba(255,200,0,0.6), 0 4px 8px rgba(0,0,0,0.8);
  margin-bottom: 6px; letter-spacing: 6px;
}
#start-screen .subtitle {
  font-size: 15px; color: #aaa; margin-bottom: 36px; letter-spacing: 2px;
}
.btn-main {
  padding: 13px 44px; font-size: 20px; font-family: inherit;
  background: linear-gradient(135deg, #8b0000, #cc0000);
  color: #ffd700; border: 2px solid #ffd700;
  border-radius: 28px; cursor: pointer;
  transition: all 0.3s; letter-spacing: 4px;
}
.btn-main:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(255,200,0,0.4); }
.instructions {
  margin-top: 28px; color: #888; font-size: 13px;
  text-align: center; line-height: 2.2;
}
.instructions em { color: #ffd700; font-style: normal; }
#gameover-screen {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.88);
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 100;
}
#gameover-screen h2 { font-size: 32px; color: #ff4444; margin-bottom: 14px; }
#gameover-screen .final-score { font-size: 26px; color: #ffd700; margin-bottom: 6px; }
#gameover-screen .stats { color: #aaa; font-size: 15px; margin-bottom: 28px; line-height: 1.8; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="ui-overlay">
  <div class="ui-box" id="score-display">分数: 0</div>
  <div class="ui-box ui-center" id="wave-display">第 1 波</div>
  <div class="ui-box" id="lives-display">❤❤❤</div>
</div>
<div id="combo-display"></div>
<div id="talisman-display"></div>
<div id="wave-announce"></div>

<div id="start-screen">
  <h1>钟馗之一笔镇妖</h1>
  <div class="subtitle">— 手势画符 · 一击必杀 —</div>
  <button class="btn-main" id="start-btn">开始镇妖</button>
  <div class="instructions">
    🖱️ 按住滑动 <em>画符</em>，松手触发符咒<br>
    ━ 横线 = <em>横斩</em> ｜ ┃ 竖线 = <em>竖劈</em> ｜ ○ 画圆 = <em>圆封(定身)</em><br>
    △ 三角 = <em>灼烧</em> ｜ ⚡ 闪电形 = <em>雷符(链式)</em> ｜ 🔥 火焰 = <em>火符</em><br>
    画得越精准，评级越高：<em>金 → 紫 → 蓝 → 白</em><br>
    👻 别让鬼碰到钟馗！
  </div>
</div>

<div id="gameover-screen">
  <h2>钟馗倒下了...</h2>
  <div class="final-score" id="final-score">最终分数: 0</div>
  <div class="stats" id="final-stats"></div>
  <button class="btn-main" id="restart-btn">再战一次</button>
</div>

<script src="talisman-recognizer.js"></script>
<script>
// ============================================================
// 《钟馗之一笔镇妖》v2 - 集成画符识别 + 符咒特效
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = () => window.innerWidth;
const H = () => window.innerHeight;

// --- 手感参数（可调优）---
const TUNE = {
  GHOST_BASE_SPEED: 0.7,
  GHOST_SPEED_PER_WAVE: 0.1,
  GHOST_RADIUS: 18,
  KILL_RADIUS: 30,           // 画符斩杀半径
  MAX_LIVES: 3,
  COMBO_TIMEOUT: 1800,       // 连击窗口(ms)
  INK_TRAIL_MAX: 50,
  PARTICLE_LIMIT: 250,
  SHAKE_DECAY: 0.88,
  WAVE_INTERVAL: 2500,       // 波次间隔(ms)
  SPAWN_BASE_INTERVAL: 1100,
  SPAWN_MIN_INTERVAL: 350,
  TALISMAN_RANGE_BASE: 60,   // 符咒基础作用范围
  SLOWMO_DURATION: 300,      // 完美判定慢动作(ms)
};

// --- 波次配置 ---
const WAVES = [
  { count: 5,  types: ['normal'] },
  { count: 8,  types: ['normal', 'fast'] },
  { count: 10, types: ['normal', 'fast', 'shield'] },
  { count: 12, types: ['normal', 'fast', 'shield', 'split'] },
  { count: 14, types: ['normal', 'fast', 'shield', 'split', 'hidden'] },
  { count: 16, types: ['normal', 'fast', 'shield', 'split', 'hidden', 'flyer'] },
  { count: 18, types: ['normal', 'fast', 'shield', 'split', 'hidden', 'flyer', 'ink'] },
  { count: 20, types: ['normal', 'fast', 'shield', 'split', 'hidden', 'flyer', 'ink', 'general'] },
];

// --- 符咒特效配置 ---
const TALISMAN_FX = {
  '横斩符': { color: '#ffffff', range: 1.0, shape: 'hline', duration: 300, dmg: 1 },
  '竖劈符': { color: '#aaccff', range: 1.0, shape: 'vline', duration: 300, dmg: 1 },
  '斜斩符': { color: '#ffccaa', range: 0.9, shape: 'slash', duration: 250, dmg: 1 },
  '十字符': { color: '#88ccff', range: 1.3, shape: 'cross', duration: 400, dmg: 2 },
  '三角镇': { color: '#ff6633', range: 1.2, shape: 'triangle', duration: 3000, dmg: 1, dot: true },
  '圆封符': { color: '#44aaff', range: 1.5, shape: 'circle', duration: 2000, dmg: 1, freeze: true },
  '雷符':   { color: '#aa44ff', range: 1.4, shape: 'lightning', duration: 500, dmg: 2, chain: 5 },
  '火符':   { color: '#ff4400', range: 1.6, shape: 'fire', duration: 3000, dmg: 1, dot: true },
  '冰符':   { color: '#44ddff', range: 99, shape: 'ice', duration: 4000, dmg: 0, slow: 0.5 },
  '螺旋符': { color: '#ffaa00', range: 1.8, shape: 'vortex', duration: 1500, dmg: 2, pull: true },
  '敕令':   { color: '#ffd700', range: 99, shape: 'edict', duration: 1000, dmg: 99 },
};

// --- 游戏状态 ---
let state = 'start';
let score = 0, lives = 3, wave = 0, combo = 0, maxCombo = 0, kills = 0;
let lastKillTime = 0;
let ghosts = [], particles = [], floatTexts = [], fxEffects = [];
let inkTrail = [], drawPoints = [];
let isDrawing = false;
let shake = { x: 0, y: 0, power: 0 };
let slowmo = { active: false, timer: 0, factor: 1 };
let gameTime = 0, lastTime = 0;
let waveSpawned = 0, waveTotal = 0, lastSpawn = 0, waveDelay = 0;
let bgLanterns = [];
let zhongkui = { x: 0, y: 0, r: 28, phase: 0 };

// --- 画符识别器 ---
let recognizer = null;
let strokeDetector = null;

function initRecognizer() {
  if (window.TalismanSystem) {
    recognizer = new TalismanSystem.TalismanRecognizer();
    strokeDetector = new TalismanSystem.RealtimeStrokeDetector(recognizer);
  }
}

// --- 音效 ---
let audioCtx = null;
function initAudio() { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function sfx(type, freq = 440, dur = 0.15, vol = 0.15) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfxKill() { sfx('sine', 600 + combo * 80, 0.12, 0.18); }
function sfxSlash() { sfx('sawtooth', 900, 0.08, 0.1); }
function sfxPerfect() { sfx('sine', 523, 0.1, 0.2); setTimeout(() => sfx('sine', 784, 0.15, 0.2), 100); }
function sfxHurt() { sfx('square', 120, 0.25, 0.2); }
function sfxTalisman(grade) {
  if (grade === '金') { sfx('sine', 880, 0.3, 0.2); setTimeout(() => sfx('sine', 1100, 0.2, 0.15), 150); }
  else if (grade === '紫') { sfx('triangle', 660, 0.2, 0.18); }
  else { sfx('triangle', 440, 0.15, 0.12); }
}

// --- 画布 ---
function resize() {
  canvas.width = W() * devicePixelRatio;
  canvas.height = H() * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  zhongkui.x = W() / 2;
  zhongkui.y = H() / 2;
}
window.addEventListener('resize', resize);
resize();

// --- 背景灯笼 ---
function initLanterns() {
  bgLanterns = [];
  for (let i = 0; i < 7; i++) {
    bgLanterns.push({
      x: Math.random() * W(), y: 30 + Math.random() * H() * 0.4,
      size: 10 + Math.random() * 14, phase: Math.random() * 6.28, spd: 0.3 + Math.random() * 0.4
    });
  }
}
initLanterns();

// ============================================================
// 鬼怪
// ============================================================
class Ghost {
  constructor(type) {
    this.type = type;
    this.r = TUNE.GHOST_RADIUS;
    this.alive = true;
    this.hp = type === 'shield' ? 2 : type === 'general' ? 4 : type === 'boss' ? 30 : 1;
    this.maxHp = this.hp;
    this.frozen = 0;      // 定身剩余时间
    this.slowed = 0;      // 减速剩余时间
    this.slowFactor = 1;
    this.burning = 0;     // 灼烧剩余时间
    this.burnDmg = 0;
    this.phase = Math.random() * 6.28;
    this.deathT = 0;
    this.opacity = 1;
    this.visible = type !== 'hidden';
    this.dodgeCd = 0;

    // 从边缘生成
    const side = Math.floor(Math.random() * 4);
    const m = 40;
    if (side === 0) { this.x = Math.random() * W(); this.y = -m; }
    else if (side === 1) { this.x = W() + m; this.y = Math.random() * H(); }
    else if (side === 2) { this.x = Math.random() * W(); this.y = H() + m; }
    else { this.x = -m; this.y = Math.random() * H(); }

    const spd = TUNE.GHOST_BASE_SPEED + wave * TUNE.GHOST_SPEED_PER_WAVE;
    this.speed = type === 'fast' ? spd * 1.7 : type === 'flyer' ? spd * 2.2 :
                 type === 'boss' ? spd * 0.25 : type === 'general' ? spd * 0.6 : spd;
    this.baseSpeed = this.speed;
    this.color = this._color();
    if (type === 'boss') this.r = 42;
    if (type === 'general') this.r = 24;
  }
  _color() {
    const c = { normal:'#aaddff', fast:'#44ff88', shield:'#8888ff', split:'#cc66ff',
                hidden:'#777', flyer:'#ffee88', ink:'#444', general:'#ff5555', boss:'#ff2222' };
    return c[this.type] || '#aaddff';
  }
  update(dt) {
    if (!this.alive) { this.deathT += dt; this.opacity = Math.max(0, 1 - this.deathT / 250); return this.deathT < 250; }

    // 状态效果
    if (this.frozen > 0) { this.frozen -= dt; return true; }
    let spdMul = 1;
    if (this.slowed > 0) { this.slowed -= dt; spdMul = this.slowFactor; }
    if (this.burning > 0) {
      this.burning -= dt;
      if (Math.random() < 0.05) { this.hp -= this.burnDmg; if (this.hp <= 0) { this.die(); return true; } }
    }

    // 移动
    const dx = zhongkui.x - this.x, dy = zhongkui.y - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const spd = this.speed * spdMul * (dt / 16);
    this.x += (dx / dist) * spd;
    this.y += (dy / dist) * spd;
    this.phase += dt * 0.004;

    // 隐藏鬼现形
    if (this.type === 'hidden' && dist < 140) this.visible = true;

    // 躲避（wave>=4）
    if (wave >= 4 && this.dodgeCd <= 0 && isDrawing && drawPoints.length > 2) {
      const lp = drawPoints[drawPoints.length - 1];
      if (Math.hypot(this.x - lp.x, this.y - lp.y) < 70) {
        this.x += (-dy / dist) * 4;
        this.y += (dx / dist) * 4;
        this.dodgeCd = 600;
      }
    }
    if (this.dodgeCd > 0) this.dodgeCd -= dt;

    // 碰到钟馗
    if (dist < zhongkui.r + this.r * 0.6) { this.die(); hurtPlayer(); return false; }
    return true;
  }
  die() { this.alive = false; this.deathT = 0; }
  hit(dmg) {
    this.hp -= dmg;
    if (this.hp <= 0) { this.die(); return true; }
    return false;
  }
  draw(c) {
    if (!this.visible && this.type === 'hidden') {
      c.save(); c.globalAlpha = 0.5; c.fillStyle = '#995533';
      c.beginPath(); c.ellipse(this.x, this.y, 9, 13, 0, 0, 6.28); c.fill(); c.restore();
      return;
    }
    c.save();
    c.globalAlpha = this.opacity;
    c.translate(this.x, this.y + Math.sin(this.phase) * 3);

    // 灼烧光环
    if (this.burning > 0) {
      c.shadowColor = '#ff4400'; c.shadowBlur = 12;
    }
    // 冰冻效果
    if (this.frozen > 0) {
      c.shadowColor = '#44ddff'; c.shadowBlur = 10;
    }

    // 身体
    const g = c.createRadialGradient(-3, -3, 0, 0, 0, this.r);
    g.addColorStop(0, this.color);
    g.addColorStop(1, 'rgba(0,0,20,0.4)');
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, this.r, 0, 6.28); c.fill();

    // 尾巴
    c.globalAlpha = this.opacity * 0.5;
    c.fillStyle = this.color;
    c.beginPath();
    c.moveTo(-this.r * 0.6, this.r * 0.4);
    for (let i = 0; i <= 5; i++) {
      c.lineTo(-this.r * 0.6 + (this.r * 1.2 / 5) * i, this.r * 0.4 + Math.sin(this.phase * 3 + i) * 4 + 7);
    }
    c.lineTo(this.r * 0.6, this.r * 0.4);
    c.closePath(); c.fill();
    c.globalAlpha = this.opacity;

    // 眼睛
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(-5, -3, 4.5, 0, 6.28); c.arc(5, -3, 4.5, 0, 6.28); c.fill();
    c.fillStyle = '#111';
    c.beginPath(); c.arc(-4, -3, 2, 0, 6.28); c.arc(6, -3, 2, 0, 6.28); c.fill();

    // 嘴
    c.strokeStyle = '#333'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(0, 4, 3.5, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();

    // 盾牌
    if (this.type === 'shield') {
      c.fillStyle = 'rgba(100,100,220,0.6)';
      c.fillRect(-this.r - 4, -this.r * 0.8, 5, this.r * 1.6);
    }
    // 翅膀
    if (this.type === 'flyer') {
      c.fillStyle = 'rgba(255,238,136,0.5)';
      c.beginPath(); c.ellipse(-this.r - 4, -2, 8, 4, -0.3, 0, 6.28); c.fill();
      c.beginPath(); c.ellipse(this.r + 4, -2, 8, 4, 0.3, 0, 6.28); c.fill();
    }
    // BOSS血条
    if (this.type === 'boss') {
      c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(-28, -this.r - 10, 56, 5);
      c.fillStyle = '#ff3333'; c.fillRect(-28, -this.r - 10, 56 * (this.hp / this.maxHp), 5);
    }
    // 冰冻覆盖
    if (this.frozen > 0) {
      c.fillStyle = 'rgba(100,220,255,0.3)';
      c.beginPath(); c.arc(0, 0, this.r + 3, 0, 6.28); c.fill();
    }
    c.restore();
  }
}

// ============================================================
// 粒子 & 浮动文字 & 特效
// ============================================================
class Particle {
  constructor(x, y, color, opts = {}) {
    this.x = x; this.y = y; this.color = color;
    this.vx = opts.vx || (Math.random() - 0.5) * 6;
    this.vy = opts.vy || (Math.random() - 0.5) * 6;
    this.size = opts.size || 2 + Math.random() * 4;
    this.life = 1;
    this.decay = opts.decay || 0.02 + Math.random() * 0.02;
    this.gravity = opts.gravity || 0;
    this.type = opts.type || 'circle';
  }
  update(dt) {
    const f = dt / 16;
    this.life -= this.decay * f;
    this.x += this.vx * f; this.y += this.vy * f;
    this.vy += this.gravity * f;
    this.vx *= 0.97; this.vy *= 0.97;
    return this.life > 0;
  }
  draw(c) {
    c.save(); c.globalAlpha = Math.max(0, this.life);
    c.fillStyle = this.color;
    if (this.type === 'circle') {
      c.beginPath(); c.arc(this.x, this.y, this.size * this.life, 0, 6.28); c.fill();
    } else if (this.type === 'coin') {
      c.fillStyle = '#ffd700';
      c.beginPath(); c.arc(this.x, this.y, 4, 0, 6.28); c.fill();
      c.strokeStyle = '#aa8800'; c.lineWidth = 1; c.stroke();
    } else if (this.type === 'spark') {
      c.fillRect(this.x, this.y, this.size * 2 * this.life, 1.5);
    }
    c.restore();
  }
}

class FloatText {
  constructor(x, y, text, color, size = 18) {
    this.x = x; this.y = y; this.text = text; this.color = color; this.size = size;
    this.life = 1; this.vy = -1.2;
  }
  update(dt) { this.life -= 0.018 * (dt / 16); this.y += this.vy * (dt / 16); return this.life > 0; }
  draw(c) {
    c.save(); c.globalAlpha = this.life;
    c.font = `bold ${this.size}px STKaiti, KaiTi, serif`;
    c.textAlign = 'center'; c.fillStyle = this.color;
    c.shadowColor = this.color; c.shadowBlur = 8;
    c.fillText(this.text, this.x, this.y);
    c.restore();
  }
}

// 符咒视觉特效（持续型）
class TalismanFX {
  constructor(x, y, config, points, grade) {
    this.x = x; this.y = y;
    this.config = config;
    this.points = points;  // 画符轨迹点
    this.grade = grade;
    this.life = config.duration;
    this.maxLife = config.duration;
    this.color = config.color;
    this.range = TUNE.TALISMAN_RANGE_BASE * config.range * (grade === '金' ? 1.5 : grade === '紫' ? 1.2 : 1);
  }
  update(dt) { this.life -= dt; return this.life > 0; }
  get progress() { return 1 - this.life / this.maxLife; }
  draw(c) {
    const p = this.progress;
    const alpha = p < 0.2 ? p / 0.2 : p > 0.7 ? (1 - p) / 0.3 : 1;
    c.save();
    c.globalAlpha = alpha * 0.7;
    c.strokeStyle = this.color;
    c.lineWidth = 3;
    c.shadowColor = this.color;
    c.shadowBlur = 15;

    const shape = this.config.shape;
    if (shape === 'circle') {
      c.beginPath();
      c.arc(this.x, this.y, this.range * Math.min(1, p * 3), 0, 6.28);
      c.stroke();
      c.globalAlpha = alpha * 0.15;
      c.fillStyle = this.color;
      c.fill();
    } else if (shape === 'triangle') {
      const r = this.range;
      c.beginPath();
      c.moveTo(this.x, this.y - r);
      c.lineTo(this.x - r * 0.87, this.y + r * 0.5);
      c.lineTo(this.x + r * 0.87, this.y + r * 0.5);
      c.closePath(); c.stroke();
      c.globalAlpha = alpha * 0.1; c.fillStyle = this.color; c.fill();
    } else if (shape === 'cross') {
      const r = this.range;
      c.beginPath();
      c.moveTo(this.x - r, this.y); c.lineTo(this.x + r, this.y);
      c.moveTo(this.x, this.y - r); c.lineTo(this.x, this.y + r);
      c.stroke();
    } else if (shape === 'lightning') {
      // 链式闪电在触发时一次性绘制
      if (p < 0.3) {
        c.lineWidth = 2 + (1 - p / 0.3) * 3;
        if (this.chainTargets) {
          for (const t of this.chainTargets) {
            c.beginPath(); c.moveTo(this.x, this.y);
            const mx = (this.x + t.x) / 2 + (Math.random() - 0.5) * 20;
            const my = (this.y + t.y) / 2 + (Math.random() - 0.5) * 20;
            c.quadraticCurveTo(mx, my, t.x, t.y);
            c.stroke();
          }
        }
      }
    } else if (shape === 'fire') {
      const r = this.range;
      for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * 6.28 + p * 3;
        const fx = this.x + Math.cos(angle) * r * 0.6;
        const fy = this.y + Math.sin(angle) * r * 0.6 - Math.sin(p * 10 + i) * 10;
        c.globalAlpha = alpha * 0.5;
        c.fillStyle = i % 2 === 0 ? '#ff4400' : '#ffaa00';
        c.beginPath(); c.arc(fx, fy, 6 + Math.sin(p * 8 + i) * 3, 0, 6.28); c.fill();
      }
    } else if (shape === 'ice') {
      c.globalAlpha = alpha * 0.3;
      c.fillStyle = '#44ddff';
      c.fillRect(0, 0, W(), H());
      // 雪花粒子
      for (let i = 0; i < 8; i++) {
        const sx = Math.random() * W(), sy = Math.random() * H();
        c.globalAlpha = alpha * 0.6;
        c.fillStyle = '#aaeeff';
        c.beginPath(); c.arc(sx, sy, 2, 0, 6.28); c.fill();
      }
    } else if (shape === 'vortex') {
      const r = this.range * (1 - p * 0.5);
      for (let i = 0; i < 3; i++) {
        const angle = p * 12 + i * 2.09;
        c.beginPath();
        c.arc(this.x, this.y, r * (0.4 + i * 0.3), angle, angle + 1.5);
        c.stroke();
      }
    } else if (shape === 'edict') {
      // 全屏金光扩散
      const r = Math.max(W(), H()) * p;
      c.globalAlpha = alpha * 0.4;
      c.fillStyle = '#ffd700';
      c.beginPath(); c.arc(this.x, this.y, r, 0, 6.28); c.fill();
    } else if (shape === 'hline' || shape === 'vline' || shape === 'slash') {
      // 沿轨迹的斩击线
      if (this.points && this.points.length > 1) {
        c.lineWidth = 4 * (1 - p);
        c.beginPath();
        c.moveTo(this.points[0].x, this.points[0].y);
        for (let i = 1; i < this.points.length; i++) {
          c.lineTo(this.points[i].x, this.points[i].y);
        }
        c.stroke();
      }
    }
    c.restore();
  }
}

// ============================================================
// 符咒触发逻辑
// ============================================================
function triggerTalisman(result, points) {
  const name = result.name;
  const fx = TALISMAN_FX[name];
  if (!fx) return;

  const grade = result.grade ? result.grade.label : '白';
  const cx = points.reduce((s, p) => s + p.x, 0) / points.length;
  const cy = points.reduce((s, p) => s + p.y, 0) / points.length;
  const range = TUNE.TALISMAN_RANGE_BASE * fx.range * (grade === '金' ? 1.5 : grade === '紫' ? 1.2 : 1);

  // 创建视觉特效
  const effect = new TalismanFX(cx, cy, fx, points, grade);
  fxEffects.push(effect);

  // 显示符咒名
  showTalismanName(name, grade, fx.color);

  // 音效
  sfxTalisman(grade);

  // 应用gameplay效果
  const dmg = fx.dmg * (grade === '金' ? 3 : grade === '紫' ? 2 : 1);

  if (name === '冰符') {
    // 全屏减速
    for (const g of ghosts) {
      if (g.alive) { g.slowed = fx.duration; g.slowFactor = fx.slow; }
    }
    floatTexts.push(new FloatText(W() / 2, H() * 0.35, '❄ 全场冰冻！', '#44ddff', 26));
    return;
  }

  if (name === '敕令') {
    // 全屏秒杀
    triggerSlowmo(500);
    shake.power = 15;
    for (const g of ghosts) {
      if (g.alive) { killGhost(g, 1); }
    }
    floatTexts.push(new FloatText(W() / 2, H() * 0.35, '⚡ 敕令·万鬼伏诛！', '#ffd700', 32));
    return;
  }

  if (name === '雷符') {
    // 链式闪电
    let targets = ghosts.filter(g => g.alive && Math.hypot(g.x - cx, g.y - cy) < range);
    targets.sort((a, b) => Math.hypot(a.x - cx, a.y - cy) - Math.hypot(b.x - cx, b.y - cy));
    targets = targets.slice(0, fx.chain);
    effect.chainTargets = targets.map(t => ({ x: t.x, y: t.y }));
    for (const t of targets) {
      if (killGhost(t, dmg)) {
        spawnParticles(t.x, t.y, '#aa44ff', 8);
      }
    }
    return;
  }

  if (name === '螺旋符') {
    // 吸引+伤害
    for (const g of ghosts) {
      if (!g.alive) continue;
      const d = Math.hypot(g.x - cx, g.y - cy);
      if (d < range) {
        // 拉向中心
        const pull = 3;
        g.x += (cx - g.x) / d * pull;
        g.y += (cy - g.y) / d * pull;
        if (d < range * 0.4) killGhost(g, dmg);
      }
    }
    return;
  }

  // 范围型（横斩/竖劈/斜斩/十字/三角/圆封/火符）
  for (const g of ghosts) {
    if (!g.alive) continue;
    const d = Math.hypot(g.x - cx, g.y - cy);

    // 线型符咒：检测点到轨迹的距离
    let inRange = false;
    if (fx.shape === 'hline' || fx.shape === 'vline' || fx.shape === 'slash') {
      for (let i = 1; i < points.length; i++) {
        if (ptSegDist(g.x, g.y, points[i-1].x, points[i-1].y, points[i].x, points[i].y) < TUNE.KILL_RADIUS + g.r) {
          inRange = true; break;
        }
      }
    } else {
      inRange = d < range + g.r;
    }

    if (inRange) {
      // 圆封：定身
      if (fx.freeze) { g.frozen = fx.duration; }
      // 灼烧/火符：持续伤害
      if (fx.dot) { g.burning = fx.duration; g.burnDmg = 0.02; }
      // 直接伤害
      if (dmg > 0) killGhost(g, dmg);
    }
  }

  // 完美判定慢动作
  if (grade === '金') triggerSlowmo(TUNE.SLOWMO_DURATION);
}

function showTalismanName(name, grade, color) {
  const el = document.getElementById('talisman-display');
  const gradeText = grade === '金' ? '✦完美✦ ' : grade === '紫' ? '◆优秀◆ ' : grade === '蓝' ? '●良好● ' : '';
  el.textContent = `${gradeText}${name}！`;
  el.style.color = color;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 1200);
}

// ============================================================
// 击杀 & 连击
// ============================================================
function killGhost(ghost, dmg) {
  const died = ghost.hit(dmg);
  if (!died) return false;

  kills++;
  const now = Date.now();
  combo = (now - lastKillTime < TUNE.COMBO_TIMEOUT) ? combo + 1 : 1;
  lastKillTime = now;
  maxCombo = Math.max(maxCombo, combo);

  const base = ghost.type === 'boss' ? 500 : ghost.type === 'general' ? 50 : 10;
  const gained = Math.floor(base * (1 + (combo - 1) * 0.4));
  score += gained;

  spawnParticles(ghost.x, ghost.y, ghost.color, 10);
  spawnParticles(ghost.x, ghost.y, '#ffd700', 5);
  for (let i = 0; i < 2; i++) {
    particles.push(new Particle(ghost.x, ghost.y, '#ffd700', { type: 'coin', vy: -3 - Math.random() * 3, gravity: 0.12, decay: 0.01 }));
  }
  floatTexts.push(new FloatText(ghost.x, ghost.y - 15, `+${gained}`, '#ffd700', 14 + Math.min(combo, 8)));

  sfxKill();
  shake.power = Math.min(3 + combo * 0.8, 10);

  // 分身
  if (ghost.type === 'split' && ghost.r > 10) {
    for (let i = 0; i < 2; i++) {
      const child = new Ghost('normal');
      child.x = ghost.x + (i ? -12 : 12); child.y = ghost.y;
      child.r = 11; child.speed *= 1.3;
      ghosts.push(child);
    }
  }

  if (combo >= 3) showCombo(combo);
  updateUI();
  return true;
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n && particles.length < TUNE.PARTICLE_LIMIT; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function showCombo(c) {
  const el = document.getElementById('combo-display');
  const t = c >= 10 ? `${c}连·万鬼伏诛！` : c >= 7 ? `${c}连·天崩！` : c >= 5 ? `${c}连·鬼哭！` : `${c}连斩！`;
  el.textContent = t;
  el.style.opacity = '1';
  el.style.transform = `translate(-50%,-50%) scale(${1 + c * 0.04})`;
  setTimeout(() => { el.style.opacity = '0'; }, 900);
}

function triggerSlowmo(ms) {
  slowmo.active = true;
  slowmo.timer = ms;
  slowmo.factor = 0.3;
}

function hurtPlayer() {
  lives--;
  sfxHurt();
  shake.power = 12;
  updateUI();
  if (lives <= 0) gameOver();
}

// ============================================================
// 画符输入
// ============================================================
function startDraw(x, y) {
  isDrawing = true;
  drawPoints = [{ x, y, t: Date.now() }];
  inkTrail = [{ x, y, w: 4, a: 1 }];
  if (strokeDetector) strokeDetector.startStroke(x, y);
}

function moveDraw(x, y) {
  if (!isDrawing) return;
  const last = drawPoints[drawPoints.length - 1];
  const dist = Math.hypot(x - last.x, y - last.y);
  if (dist < 3) return;

  const now = Date.now();
  drawPoints.push({ x, y, t: now });

  // 笔锋：速度→粗细
  const dt = now - last.t || 16;
  const speed = dist / dt * 1000;
  const w = speed > 800 ? 2 : speed > 400 ? 4 : 7;
  inkTrail.push({ x, y, w, a: 1 });
  if (inkTrail.length > TUNE.INK_TRAIL_MAX) inkTrail.shift();

  if (strokeDetector) strokeDetector.addPoint(x, y);

  // 实时碰撞（画过即斩）
  for (const g of ghosts) {
    if (!g.alive || !g.visible) continue;
    if (ptSegDist(g.x, g.y, last.x, last.y, x, y) < g.r + TUNE.KILL_RADIUS * 0.6) {
      killGhost(g, 1);
      sfxSlash();
    }
  }
}

function endDraw() {
  if (!isDrawing) return;
  isDrawing = false;

  // 使用识别器判定符咒
  if (drawPoints.length >= 5) {
    let result;
    if (strokeDetector) {
      const out = strokeDetector.endStroke();
      if (out && out.result) result = out.result;
    }
    if (!result && recognizer) {
      const pts = drawPoints.map(p => new TalismanSystem.StrokePoint(p.x, p.y, p.t));
      result = recognizer.recognize(pts);
    }
    if (result && result.isSuccessful) {
      triggerTalisman(result, drawPoints);
    }
  }

  setTimeout(() => { inkTrail = []; }, 400);
  drawPoints = [];
}

function ptSegDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

// ============================================================
// 波次管理
// ============================================================
function startWave() {
  if (wave >= WAVES.length) {
    // BOSS
    const boss = new Ghost('boss');
    ghosts.push(boss);
    waveTotal = 999; waveSpawned = 999;
    floatTexts.push(new FloatText(W() / 2, H() * 0.3, '👹 百鬼王驾到！', '#ff2222', 30));
    announceWave('最终波 · 百鬼王');
    return;
  }
  const cfg = WAVES[wave];
  waveTotal = cfg.count;
  waveSpawned = 0;
  lastSpawn = gameTime;
  announceWave(`第 ${wave + 1} 波`);
  updateUI();
}

function announceWave(text) {
  const el = document.getElementById('wave-announce');
  el.textContent = text;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 1800);
}

function spawnWaveGhost() {
  if (wave >= WAVES.length) return;
  const cfg = WAVES[wave];
  const type = cfg.types[Math.floor(Math.random() * cfg.types.length)];
  ghosts.push(new Ghost(type));
  waveSpawned++;
}

function checkWaveEnd() {
  if (wave >= WAVES.length) return; // BOSS wave
  if (waveSpawned >= waveTotal && ghosts.filter(g => g.alive).length === 0) {
    wave++;
    waveDelay = TUNE.WAVE_INTERVAL;
  }
}

// ============================================================
// 渲染
// ============================================================
function drawBg() {
  const grad = ctx.createRadialGradient(W()/2, H()/2, 0, W()/2, H()/2, Math.max(W(), H()) * 0.7);
  grad.addColorStop(0, '#1a1a3a');
  grad.addColorStop(1, '#0a0a1a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W(), H());

  // 灯笼
  for (const l of bgLanterns) {
    l.phase += 0.008;
    ctx.save();
    ctx.globalAlpha = 0.25 + Math.sin(l.phase) * 0.1;
    ctx.fillStyle = '#ff6633';
    ctx.shadowColor = '#ff6633'; ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.ellipse(l.x, l.y + Math.sin(l.phase * l.spd) * 3, l.size * 0.55, l.size, 0, 0, 6.28);
    ctx.fill();
    ctx.restore();
  }

  // 底部雾气
  ctx.save(); ctx.globalAlpha = 0.08; ctx.fillStyle = '#4488aa';
  for (let i = 0; i < 4; i++) {
    const fx = (gameTime * 0.015 + i * 250) % (W() + 200) - 100;
    ctx.beginPath(); ctx.ellipse(fx, H() - 20, 100, 20, 0, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}

function drawZhongkui() {
  const { x, y } = zhongkui;
  zhongkui.phase += 0.025;
  const p = 1 + Math.sin(zhongkui.phase) * 0.02;
  ctx.save();
  ctx.translate(x, y); ctx.scale(p, p);

  // 光环
  ctx.globalAlpha = 0.15; ctx.fillStyle = '#ffd700';
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 25;
  ctx.beginPath(); ctx.arc(0, 0, zhongkui.r + 8, 0, 6.28); ctx.fill();
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  // 红袍
  ctx.fillStyle = '#cc2222';
  ctx.beginPath(); ctx.arc(0, 4, 20, 0, 6.28); ctx.fill();
  // 头
  ctx.fillStyle = '#ffcc99';
  ctx.beginPath(); ctx.arc(0, -11, 13, 0, 6.28); ctx.fill();
  // 官帽
  ctx.fillStyle = '#222';
  ctx.fillRect(-15, -26, 30, 7);
  ctx.fillRect(-3, -33, 6, 9);
  // 怒眉
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-8, -18); ctx.lineTo(-2, -16); ctx.moveTo(8, -18); ctx.lineTo(2, -16); ctx.stroke();
  // 眼
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-4.5, -12, 3.5, 0, 6.28); ctx.arc(4.5, -12, 3.5, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-4.5, -12, 1.8, 0, 6.28); ctx.arc(4.5, -12, 1.8, 0, 6.28); ctx.fill();
  // 胡须
  ctx.strokeStyle = '#444'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-4, -4); ctx.lineTo(-7, 5); ctx.moveTo(4, -4); ctx.lineTo(7, 5); ctx.moveTo(0, -3); ctx.lineTo(0, 7); ctx.stroke();

  ctx.restore();
}

function drawInk() {
  if (inkTrail.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 1; i < inkTrail.length; i++) {
    const pt = inkTrail[i], prev = inkTrail[i - 1];
    const alpha = (i / inkTrail.length) * 0.85;
    // 墨迹
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#1a1a2e';
    ctx.lineWidth = pt.w;
    ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(pt.x, pt.y); ctx.stroke();
    // 金边
    if (isDrawing) {
      ctx.globalAlpha = alpha * 0.4;
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = pt.w + 2;
      ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(pt.x, pt.y); ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
  // 笔尖
  if (isDrawing && inkTrail.length > 0) {
    const tip = inkTrail[inkTrail.length - 1];
    ctx.globalAlpha = 0.9; ctx.fillStyle = '#ffd700';
    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(tip.x, tip.y, 3.5, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}

function render() {
  ctx.save();
  if (shake.power > 0.5) {
    shake.x = (Math.random() - 0.5) * shake.power;
    shake.y = (Math.random() - 0.5) * shake.power;
    shake.power *= TUNE.SHAKE_DECAY;
    ctx.translate(shake.x, shake.y);
  }
  ctx.clearRect(-15, -15, W() + 30, H() + 30);
  drawBg();
  for (const g of ghosts) g.draw(ctx);
  drawZhongkui();
  drawInk();
  for (const fx of fxEffects) fx.draw(ctx);
  for (const p of particles) p.draw(ctx);
  for (const ft of floatTexts) ft.draw(ctx);
  ctx.restore();
}

// ============================================================
// 主循环
// ============================================================
function loop(ts) {
  let dt = Math.min(ts - lastTime, 50);
  lastTime = ts;

  // 慢动作
  if (slowmo.active) {
    slowmo.timer -= dt;
    if (slowmo.timer <= 0) { slowmo.active = false; slowmo.factor = 1; }
    dt *= slowmo.factor;
  }

  gameTime += dt;

  if (state === 'playing') {
    // 波次延迟
    if (waveDelay > 0) {
      waveDelay -= dt;
      if (waveDelay <= 0) startWave();
    } else {
      // 生成鬼
      if (waveSpawned < waveTotal) {
        const interval = Math.max(TUNE.SPAWN_MIN_INTERVAL, TUNE.SPAWN_BASE_INTERVAL - wave * 90);
        if (gameTime - lastSpawn > interval) { spawnWaveGhost(); lastSpawn = gameTime; }
      }
      checkWaveEnd();
    }

    // 更新
    ghosts = ghosts.filter(g => g.update(dt));
    particles = particles.filter(p => p.update(dt));
    floatTexts = floatTexts.filter(ft => ft.update(dt));
    fxEffects = fxEffects.filter(fx => fx.update(dt));
    if (!isDrawing) inkTrail = inkTrail.filter(pt => { pt.a -= 0.04; return pt.a > 0; });
  }

  render();
  requestAnimationFrame(loop);
}

// ============================================================
// UI & 流程
// ============================================================
function updateUI() {
  document.getElementById('score-display').textContent = `分数: ${score}`;
  document.getElementById('wave-display').textContent = wave >= WAVES.length ? '最终波' : `第 ${wave + 1} 波`;
  document.getElementById('lives-display').textContent = '❤'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, TUNE.MAX_LIVES - lives));
}

function startGame() {
  state = 'playing';
  score = 0; lives = TUNE.MAX_LIVES; wave = 0; combo = 0; maxCombo = 0; kills = 0;
  ghosts = []; particles = []; floatTexts = []; fxEffects = []; inkTrail = []; drawPoints = [];
  gameTime = 0; waveDelay = 500; shake = { x: 0, y: 0, power: 0 };
  slowmo = { active: false, timer: 0, factor: 1 };
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('gameover-screen').style.display = 'none';
  updateUI();
}

function gameOver() {
  state = 'gameover';
  document.getElementById('gameover-screen').style.display = 'flex';
  document.getElementById('final-score').textContent = `最终分数: ${score}`;
  document.getElementById('final-stats').innerHTML =
    `击杀: ${kills} ｜ 最高连击: ${maxCombo}<br>存活波次: ${Math.min(wave + 1, WAVES.length + 1)}`;
}

// ============================================================
// 事件绑定
// ============================================================
canvas.addEventListener('mousedown', e => { if (state === 'playing') startDraw(e.clientX, e.clientY); });
canvas.addEventListener('mousemove', e => { if (state === 'playing') moveDraw(e.clientX, e.clientY); });
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchstart', e => { e.preventDefault(); if (state === 'playing') startDraw(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); if (state === 'playing') moveDraw(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); endDraw(); }, { passive: false });

document.getElementById('start-btn').addEventListener('click', () => { initAudio(); initRecognizer(); startGame(); });
document.getElementById('restart-btn').addEventListener('click', startGame);

// 启动
requestAnimationFrame(loop);
</script>
